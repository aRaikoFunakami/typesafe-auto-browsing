[project]
name = "typesafe-auto-browsing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
typesafe-auto-browsing = "typesafe_auto_browsing:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
