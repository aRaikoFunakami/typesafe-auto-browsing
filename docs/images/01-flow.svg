<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img"><title>1 回の実行の全体の流れ</title><desc>目的を受け取り、ページを読む・page を作る・判断する・引数を決める・実行する、を繰り返す。達成か失敗で終わり、結果を返す。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8.5 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.6" y="0.6" width="898.8" height="638.8" rx="14" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.2"/><text x="28" y="30" font-size="20" font-weight="700" text-anchor="start" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">1 回の実行の全体の流れ</text>
<text x="28" y="54" font-size="13" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">灰色 = プログラムの処理　紫の帯 = TypeSafe に聞く回数　青 = 入出力</text>
<rect x="40" y="70" width="820" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="450.0" y="82.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">目的（goal）: 自然言語の 1 文</text>
<text x="450.0" y="101.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">例: https://transit.yahoo.co.jp/ で横浜から青森までを検索して</text>
<line x1="450" y1="116" x2="450" y2="136" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="138" width="820" height="44" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="450.0" y="150.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">起動: Playwright MCP（Chrome）を開き、list_tools でツール一覧を取る</text>
<text x="450.0" y="169.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">スキーマだけでは決められないツール（JavaScript のコードを要するもの）は、選択肢から外す</text>
<line x1="450" y1="184" x2="450" y2="206" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="20" y="208" width="860" height="232" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="34" y="226" font-size="13" font-weight="600" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ループ（最大 20 ステップ。1 周 = 1 ステップ）</text>
<rect x="40" y="236" width="146" height="112" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="113.0" y="263.5" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">① ページを読む</text>
<text x="113.0" y="282.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">browser_snapshot</text>
<text x="113.0" y="301.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">操作の直後は落ち着く</text>
<text x="113.0" y="320.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">まで取り直す</text>
<rect x="40" y="348" width="146" height="26" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="113.0" y="361.0" font-size="12" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">聞かない</text>
<rect x="212" y="236" width="146" height="112" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="285.0" y="263.5" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">② page を作る（C）</text>
<text x="285.0" y="282.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">短いページ: そのまま</text>
<text x="285.0" y="301.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">長いページ: 8KB の</text>
<text x="285.0" y="320.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">パートに分けて絞る</text>
<rect x="212" y="348" width="146" height="26" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="285.0" y="361.0" font-size="12" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">聞く: パート数だけ</text>
<rect x="384" y="236" width="146" height="112" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="457.0" y="263.5" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">③ 判断（A）</text>
<text x="457.0" y="282.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">done: 達成済みか</text>
<text x="457.0" y="301.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">tool: 次のツールは</text>
<text x="457.0" y="320.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">done ≥ 0.8 で成功</text>
<rect x="384" y="348" width="146" height="26" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="457.0" y="361.0" font-size="12" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">聞く: 1 回（2 問）</text>
<rect x="556" y="236" width="146" height="112" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="629.0" y="263.5" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">④ 引数（B）</text>
<text x="629.0" y="282.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">スキーマの項目ごとに</text>
<text x="629.0" y="301.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">質問を作って聞き、</text>
<text x="629.0" y="320.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">next_action に足す</text>
<rect x="556" y="348" width="146" height="26" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="629.0" y="361.0" font-size="12" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">聞く: 項目の数だけ</text>
<rect x="728" y="236" width="146" height="112" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="801.0" y="263.5" font-size="14" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">⑤ 実行</text>
<text x="801.0" y="282.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">MCP でツールを呼ぶ</text>
<text x="801.0" y="301.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">history に 1 行足す</text>
<text x="801.0" y="320.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">失敗の理由も残す</text>
<rect x="728" y="348" width="146" height="26" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="801.0" y="361.0" font-size="12" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">聞かない</text>
<line x1="188" y1="292" x2="210" y2="292" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="360" y1="292" x2="382" y2="292" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="532" y1="292" x2="554" y2="292" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="704" y1="292" x2="726" y2="292" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M801 376 L801 402 L113 402 L113 378" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="290" y="420" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">次のステップへ（history が増え、ページも変わる）</text>
<path d="M465 376 L465 458" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="250" y="460" width="250" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="375.0" y="482.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#085041" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">成功</text>
<text x="375.0" y="501.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#0F6E56" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">③ の done が 0.8 以上</text>
<path d="M760 442 L760 460" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="520" y="460" width="340" height="64" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text x="690.0" y="473.0" font-size="14.5" font-weight="600" text-anchor="middle" fill="#633806" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">失敗</text>
<text x="690.0" y="492.0" font-size="12" font-weight="400" text-anchor="middle" fill="#854F0B" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">同じ呼び出しが 3 回 / 最大ステップ数</text>
<text x="690.0" y="511.0" font-size="12" font-weight="400" text-anchor="middle" fill="#854F0B" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ツールが使えない / ブラウザを閉じた</text>
<line x1="375" y1="526" x2="375" y2="548" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="690" y1="526" x2="690" y2="548" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="550" width="820" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="450.0" y="570.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">結果を返す（--json なら JSON、そうでなければ表示）</text>
<text x="450.0" y="589.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">success / reason / page.url / page.title / page.snapshot（最後のページ全文のファイル）/ usage / trace</text></svg>
