<text x="495.0" y="229.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">doubleClick（Noul）</text>
<text x="495.0" y="248.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">「true にすべきか」</text>
<line x1="662" y1="239.0" x2="708" y2="239.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="712" y="204" width="160" height="70" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="792.0" y="229.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#085041" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">0.05</text>
<text x="792.0" y="248.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#0F6E56" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">→ 指定しない</text>
<rect x="28" y="292" width="250" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="153.0" y="317.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">button</text>
<text x="153.0" y="336.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">enum: left / right / middle</text>
<line x1="280" y1="327.0" x2="326" y2="327.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="330" y="292" width="330" height="70" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="495.0" y="317.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">button（Choice）</text>
<text x="495.0" y="336.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">選択肢 = enum の値</text>
<line x1="662" y1="327.0" x2="708" y2="327.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="712" y="292" width="160" height="70" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="792.0" y="327.0" font-size="14.5" font-weight="600" text-anchor="middle" fill="#085041" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">left（0.74）</text>
<rect x="28" y="380" width="250" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="153.0" y="405.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">modifiers</text>
<text x="153.0" y="424.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">enum の配列（Alt, Control …）</text>
<line x1="280" y1="415.0" x2="326" y2="415.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="330" y="380" width="330" height="70" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="495.0" y="405.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">modifiers.Alt … modifiers.Shift</text>
<text x="495.0" y="424.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">項目ごとの Noul × 5「含めるか」</text>
<line x1="662" y1="415.0" x2="708" y2="415.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="712" y="380" width="160" height="70" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="792.0" y="405.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#085041" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">0.05〜0.08</text>
<text x="792.0" y="424.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#0F6E56" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">→ どれも含めない</text>
<rect x="28" y="468" width="250" height="70" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="153.0" y="493.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">element</text>
<text x="153.0" y="512.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">string（人が読む名前）</text>
<line x1="280" y1="503.0" x2="326" y2="503.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="330" y="468" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="495.0" y="493.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">（聞かない）</text>
<text x="495.0" y="512.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ラベルにすぎないので決めない</text>
<line x1="662" y1="503.0" x2="708" y2="503.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="712" y="468" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="792.0" y="503.0" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">—</text>
<text x="28" y="574" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">型ごとの質問の作り方は本文の 3 章。質問文（instructions）は、ツール名・項目名・スキーマの説明文を、決まった英文に当てはめて作る。</text>
<text x="28" y="592" font-size="12" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">boolean と enum の配列は、必須でなければ確率が 0.5 以上のときだけ引数に入れる。</text></svg>
