<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img"><title>ツールのスキーマから質問ができるまで（browser_click）</title><desc>browser_click の input_schema の各項目が、型に応じて TypeSafe への質問になり、答えが引数になる。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8.5 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.6" y="0.6" width="898.8" height="608.8" rx="14" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.2"/><text x="28" y="30" font-size="20" font-weight="700" text-anchor="start" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ツールのスキーマの各項目が、そのまま質問になる</text>
<text x="28" y="54" font-size="13" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">例: browser_click（実際のログの seq 92。1 回のリクエストにまとめて送っている）</text>
<rect x="28" y="74" width="250" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="153.0" y="89.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">input_schema の項目（MCP が定義）</text>
<rect x="330" y="74" width="330" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="495.0" y="89.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">TypeSafe への質問</text>
<rect x="712" y="74" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="792.0" y="89.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">答え（ログの値）</text>
<rect x="28" y="116" width="250" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="153.0" y="141.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">target</text>
<text x="153.0" y="160.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">string・必須（要素の ref）</text>
<line x1="280" y1="151.0" x2="326" y2="151.0" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="330" y="116" width="330" height="70" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="495.0" y="141.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">target:0 と target:1（Choice）</text>
<text x="495.0" y="160.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">選択肢 = page の [ref]（254 個ずつ）</text>
