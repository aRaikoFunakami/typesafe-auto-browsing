<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img"><title>1 ステップの分岐</title><desc>スナップショット、page の作成、done と tool、引数、実行の順に進み、成功と各種の失敗で終わる分岐図。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8.5 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.6" y="0.6" width="898.8" height="818.8" rx="14" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.2"/><text x="28" y="30" font-size="20" font-weight="700" text-anchor="start" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">1 ステップの分岐と、終わり方</text>
<text x="28" y="54" font-size="13" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">紫 = TypeSafe に聞く　灰 = プログラム　白の点線 = 分岐　緑 = 成功　橙 = 失敗</text>
<rect x="300" y="84" width="300" height="46" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="450.0" y="97.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">① スナップショットを取る</text>
<text x="450.0" y="116.5" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">browser_snapshot</text>
<rect x="300" y="160" width="300" height="46" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="450.0" y="173.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">② page を作る（C）</text>
<text x="450.0" y="192.5" font-size="12" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">長ければパートごとに聞く</text>
<rect x="300" y="236" width="300" height="46" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="450.0" y="249.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">③ done と tool を聞く（A）</text>
<text x="450.0" y="268.5" font-size="12" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">1 回のリクエストで 2 問</text>
<rect x="300" y="312" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="450.0" y="335.0" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">history があり、done が 0.8 以上か</text>
<rect x="300" y="388" width="300" height="46" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="450.0" y="401.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">④ 引数を決める（B）</text>
<text x="450.0" y="420.5" font-size="12" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">スキーマの項目ごとに聞く</text>
<rect x="300" y="464" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="450.0" y="487.0" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">必須の引数が決まったか</text>
<rect x="300" y="540" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="450.0" y="563.0" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">同じ操作を同じページで 3 回目か</text>
<rect x="300" y="616" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="450.0" y="639.0" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">拒否されたか（--confirm のとき）</text>
<rect x="300" y="692" width="300" height="46" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="450.0" y="705.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">⑤ ツールを MCP で呼ぶ</text>
<text x="450.0" y="724.5" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">history に 1 行足す</text>
<line x1="450.0" y1="131" x2="450.0" y2="158" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="450.0" y1="207" x2="450.0" y2="234" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="450.0" y1="283" x2="450.0" y2="310" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="450.0" y1="359" x2="450.0" y2="386" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="460.0" y="373" font-size="11.5" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">いいえ</text>
<line x1="450.0" y1="435" x2="450.0" y2="462" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="450.0" y1="511" x2="450.0" y2="538" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="460.0" y="525" font-size="11.5" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">はい</text>
<line x1="450.0" y1="587" x2="450.0" y2="614" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="460.0" y="601" font-size="11.5" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">いいえ</text>
<line x1="450.0" y1="663" x2="450.0" y2="690" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="460.0" y="677" font-size="11.5" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">いいえ</text>
<path d="M299 715 L284 715 L284 107 L298 107" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="276" y="410" font-size="12" font-weight="400" text-anchor="end" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">次のステップへ</text>
<rect x="20" y="76" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="145.0" y="94.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">操作の直後は、前回と同じ形に</text>
<text x="145.0" y="113.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">なるまで取り直す（1 秒・最大 5 回）</text>
<rect x="20" y="142" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="145.0" y="160.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ダイアログが開いているときは、</text>
<text x="145.0" y="179.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">それを扱えるツールだけを候補にする</text>
<rect x="20" y="208" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="145.0" y="226.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">50,000 文字以下ならそのまま。超えると</text>
<text x="145.0" y="245.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">パートごとに outcome / control を聞く</text>
<rect x="660" y="312" width="220" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="770.0" y="325.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#085041" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">成功で終わる</text>
<text x="770.0" y="344.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0F6E56" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">結果を返す</text>
<line x1="602" y1="335" x2="658" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="630" y="325" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">はい</text>
<rect x="660" y="446" width="220" height="82" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text x="770.0" y="458.5" font-size="13" font-weight="600" text-anchor="middle" fill="#633806" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">使えるツールがない</text>
<text x="770.0" y="477.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#854F0B" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">そのツールを除いて tool を</text>
<text x="770.0" y="496.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#854F0B" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">聞き直す（最大 3 回）。なくなれば</text>
<text x="770.0" y="515.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#854F0B" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">3 ステップ連続で失敗</text>
<line x1="602" y1="487" x2="658" y2="487" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="630" y="477" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">いいえ</text>
<rect x="660" y="534" width="220" height="58" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text x="770.0" y="553.5" font-size="14.5" font-weight="600" text-anchor="middle" fill="#633806" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">見送る（多いと失敗）</text>
<text x="770.0" y="572.5" font-size="12" font-weight="400" text-anchor="middle" fill="#854F0B" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">同じ操作をくり返す</text>
<line x1="602" y1="563" x2="658" y2="563" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="630" y="553" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">はい</text>
<rect x="660" y="610" width="220" height="58" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="770.0" y="629.5" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">拒否</text>
<text x="770.0" y="648.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">DECLINED を記録し、次へ</text>
<line x1="602" y1="639" x2="658" y2="639" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="630" y="629" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">はい</text>
<rect x="660" y="682" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="770.0" y="693.0" font-size="13" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">エラーのとき</text>
<text x="770.0" y="712.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">FAILED と原因を記録。その ref は</text>
<text x="770.0" y="731.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ページが変わるまで使わない</text>
<line x1="602" y1="715" x2="658" y2="715" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="20" y="762" width="860" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<text x="450.0" y="774.5" font-size="13" font-weight="600" text-anchor="middle" fill="#633806" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ループの外で失敗する場合</text>
<text x="450.0" y="793.5" font-size="12" font-weight="400" text-anchor="middle" fill="#854F0B" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">20 ステップに達した（step limit） /  browser_close を実行した（the browser was closed）</text></svg>
