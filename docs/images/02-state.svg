<svg xmlns="http://www.w3.org/2000/svg" width="900" height="604" viewBox="0 0 900 604" role="img"><title>TypeSafe に渡す state の組み立て</title><desc>state の各キーが何から作られ、C・A・B のどの質問に入るかの対応表。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8.5 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.6" y="0.6" width="898.8" height="602.8" rx="14" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.2"/><text x="28" y="30" font-size="20" font-weight="700" text-anchor="start" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">state は、この 6 つのキーから組み立てる</text>
