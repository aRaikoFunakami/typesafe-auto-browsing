<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img"><title>位置付け: エージェントがブラウザ操作を任せる</title><desc>Claude Code などの AI エージェントが目的を typesafe-auto-browsing に渡し、typesafe-auto-browsing が Playwright MCP 経由で Chrome を操作して、最終ページのスナップショットをエージェントに返す流れ。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8.5 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8.5 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.6" y="0.6" width="898.8" height="338.8" rx="14" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="28" y="30" font-size="20" font-weight="700" text-anchor="start" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">位置付け: エージェントが、ブラウザ操作を任せる</text>
<text x="28" y="54" font-size="13" font-weight="400" text-anchor="start" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">青 = 呼び出し側のエージェント　紫 = TypeSafe　灰 = このプログラムと外部</text>

<rect x="24" y="100" width="170" height="100" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
<text x="109" y="122" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">Claude Code など</text>
<text x="109" y="141" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0C447C" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">AI エージェント</text>
<text x="109" y="165" font-size="12.5" font-weight="400" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">目的を渡す</text>
<text x="109" y="183" font-size="12.5" font-weight="400" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ページを読んで答える</text>

<rect x="274" y="88" width="200" height="124" rx="8" fill="#F1EFE8" stroke="#8A8880" stroke-width="1.2"/>
<text x="374" y="106" font-size="15" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">typesafe-auto-browsing</text>
<rect x="290" y="124" width="168" height="72" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="374" y="142" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3C3489" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">TypeSafe（Jev）</text>
<text x="374" y="161" font-size="12.5" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ツール・引数・達成を選ぶ</text>
<text x="374" y="179" font-size="12.5" font-weight="400" text-anchor="middle" fill="#534AB7" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">文章は生成しない</text>

<rect x="554" y="118" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="624" y="139" font-size="13.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">Playwright MCP</text>
<text x="624" y="160" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ツールを実行</text>

<rect x="754" y="118" width="122" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="815" y="139" font-size="13.5" font-weight="600" text-anchor="middle" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">Chrome</text>
<text x="815" y="160" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ページを操作</text>

<path d="M198 150 H270" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="234" y="122" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">目的</text>
<text x="234" y="136" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">（1 文）</text>
<path d="M478 150 H550" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="514" y="122" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ツール</text>
<text x="514" y="136" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">呼び出し</text>
<path d="M698 150 H750" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="724" y="136" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">操作</text>

<path d="M374 214 V252 H109 V204" fill="none" stroke="#378ADD" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="241" y="272" font-size="12.5" font-weight="600" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">最終ページのスナップショット（ファイルのパス）</text>
<text x="241" y="290" font-size="12" font-weight="400" text-anchor="middle" fill="#185FA5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">＋ success / reason（JSON）</text>

<text x="450" y="318" font-size="13" font-weight="400" text-anchor="middle" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',system-ui,-apple-system,'Segoe UI',sans-serif" dominant-baseline="central">ページを読んで答えを作るのは、エージェント。TypeSafe は選ぶだけで、文章を生成しない。</text>
</svg>
